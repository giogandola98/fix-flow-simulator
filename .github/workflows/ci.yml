name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  build-test:
    name: Build & test (backend + UI + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The fix-flow-ui module builds the React app and runs vitest via the
      # frontend-maven-plugin (which downloads its own Node), so a single
      # `mvn verify` covers Java tests (JaCoCo) and UI tests (vitest coverage).
      - name: Build & test
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Upload UI coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: fix-flow-ui/target/coverage/
          if-no-files-found: ignore
